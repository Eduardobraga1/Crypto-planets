<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Planets</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020510;font-family:'Space Mono',monospace}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;cursor:crosshair}
/* Header */
#header{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 24px;display:flex;align-items:center;gap:20px;background:linear-gradient(to bottom,rgba(2,5,16,.95),transparent);pointer-events:none}
.logo{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;background:linear-gradient(135deg,#a78bfa,#38bdf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;pointer-events:all}
.logo span{font-size:11px;display:block;font-weight:400;letter-spacing:.2em;color:#64748b;-webkit-text-fill-color:#64748b}
#controls{display:flex;align-items:center;gap:10px;margin-left:auto;pointer-events:all}
.ctrl-group{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden}
.ctrl-btn{background:none;border:none;color:#64748b;padding:7px 14px;cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;transition:all .2s}
.ctrl-btn:hover{color:#e2e8f0;background:rgba(255,255,255,.06)}
.ctrl-btn.active{background:rgba(139,92,246,.25);color:#a78bfa;border:1px solid rgba(139,92,246,.4)}
.search-wrap{position:relative}
#searchInput{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 14px 7px 34px;color:#e2e8f0;font-family:'Space Mono',monospace;font-size:12px;outline:none;width:180px;transition:border-color .2s}
#searchInput:focus{border-color:rgba(139,92,246,.5)}
#searchInput::placeholder{color:#334155}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#475569;font-size:14px;pointer-events:none}
/* Stats bar */
#statsBar{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:10px 24px;display:flex;gap:24px;background:linear-gradient(to top,rgba(2,5,16,.95),transparent);pointer-events:none}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-label{font-size:9px;letter-spacing:.12em;color:#334155;text-transform:uppercase}
.stat-value{font-size:13px;font-weight:700;color:#e2e8f0}
.stat-value.up{color:#34d399}
.stat-value.down{color:#f87171}
/* Tooltip */
#tooltip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s}
.tt-inner{background:rgba(7,12,28,.92);border:1px solid rgba(139,92,246,.3);border-radius:12px;padding:14px 16px;backdrop-filter:blur(12px);min-width:180px}
.tt-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tt-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#1e293b}
.tt-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:#e2e8f0}
.tt-symbol{font-size:10px;color:#64748b;letter-spacing:.1em}
.tt-row{display:flex;justify-content:space-between;gap:20px;margin-top:5px}
.tt-lbl{font-size:10px;color:#475569;letter-spacing:.08em}
.tt-val{font-size:12px;font-weight:700;color:#e2e8f0;text-align:right}
.tt-val.up{color:#34d399}
.tt-val.down{color:#f87171}
/* Loading */
#loadScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020510;gap:16px;transition:opacity .6s}
.load-logo{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#a78bfa,#38bdf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.load-bar{width:200px;height:2px;background:#0f172a;border-radius:2px;overflow:hidden}
.load-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#38bdf8);border-radius:2px;animation:load 2s ease-in-out infinite}
@keyframes load{0%{width:0;margin-left:0}70%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}
.load-text{font-size:11px;letter-spacing:.2em;color:#334155}
/* Size legend */
#legend{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.leg-item{display:flex;align-items:center;gap:8px}
.leg-dot{border-radius:50%;background:rgba(139,92,246,.3);border:1px solid rgba(139,92,246,.4)}
.leg-lbl{font-size:9px;letter-spacing:.1em;color:#334155}
/* Color legend */
#colorLegend{position:fixed;left:20px;bottom:60px;z-index:10;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.color-bar{width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,#f87171,#1e293b,#34d399)}
.color-labels{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.08em;color:#475569}
</style>
</head>
<body>

<div id="loadScreen">
  <div class="load-logo">CRYPTO PLANETS</div>
  <div class="load-bar"><div class="load-fill"></div></div>
  <div class="load-text">MAPPING THE UNIVERSE</div>
</div>

<canvas id="canvas"></canvas>

<div id="header">
  <div class="logo">CRYPTO PLANETS<span>EXPLORE THE CRYPTO UNIVERSE</span></div>
  <div id="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn" onclick="setTime('1h',this)">1H</button>
      <button class="ctrl-btn active" onclick="setTime('24h',this)">24H</button>
      <button class="ctrl-btn" onclick="setTime('7d',this)">7D</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn active" onclick="setSize('mcap',this)">MKT CAP</button>
      <button class="ctrl-btn" onclick="setSize('volume',this)">VOLUME</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌖</span>
      <input id="searchInput" placeholder="Search coin..." oninput="onSearch(this.value)">
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn" onclick="loadData()">↻ REFRESH</button>
    </div>
  </div>
</div>

<div id="statsBar">
  <div class="stat"><div class="stat-label">COINS TRACKED</div><div class="stat-value" id="s-count">—</div></div>
  <div class="stat"><div class="stat-label">TOTAL MKT CAP</div><div class="stat-value" id="s-mcap">—</div></div>
  <div class="stat"><div class="stat-label">24H VOLUME</div><div class="stat-value" id="s-vol">—</div></div>
  <div class="stat"><div class="stat-label">GAINERS</div><div class="stat-value up" id="s-up">—</div></div>
  <div class="stat"><div class="stat-label">LOSERS</div><div class="stat-value down" id="s-down">—</div></div>
</div>

<div id="legend">
  <div class="leg-item"><div class="leg-dot" style="width:40px;height:40px"></div><div class="leg-lbl">LARGE CAP</div></div>
  <div class="leg-item"><div class="leg-dot" style="width:26px;height:26px"></div><div class="leg-lbl">MID CAP</div></div>
  <div class="leg-item"><div class="leg-dot" style="width:14px;height:14px"></div><div class="leg-lbl">SMALL CAP</div></div>
</div>

<div id="colorLegend">
  <div class="color-bar"></div>
  <div class="color-labels"><span>FALLING</span><span>RISING</span></div>
</div>

<div id="tooltip"><div class="tt-inner" id="ttInner"></div></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let coins = [], bubbles = [], stars = [], nebulae = [];
let timeKey = '24h', sizeKey = 'mcap', searchQ = '';
let animId = null, hoveredBubble = null;
let mouseX = 0, mouseY = 0;
let isDragging = false, dragStart = {x:0,y:0}, viewOffset = {x:0,y:0}, viewOffsetStart = {x:0,y:0};
let scale = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  if (stars.length === 0) generateStars();
}

function generateStars() {
  stars = [];
  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.2 + 0.2,
      opacity: Math.random() * 0.6 + 0.1,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
  nebulae = [];
  for (let i = 0; i < 5; i++) {
    nebulae.push({
      x: Math.random() * W, y: Math.random() * H,
      rx: Math.random() * 300 + 150, ry: Math.random() * 200 + 100,
      hue: [260, 200, 160, 280, 220][i],
      opacity: Math.random() * 0.04 + 0.01
    });
  }
}

function fmtMoney(n) {
  if (!n) return '—';
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(4);
}
function fmtPrice(n) {
  if (!n) return '—';
  if (n >= 1000) return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (n >= 1) return '$' + n.toFixed(4);
  return '$' + n.toFixed(6);
}

function changeColor(pct) {
  if (pct === null || pct === undefined) return { r:100, g:130, b:160, a:0.7 };
  const t = Math.max(-1, Math.min(1, pct / 15));
  if (t >= 0) return { r: Math.round(30 + t*20), g: Math.round(180 + t*31), b: Math.round(120 - t*50), a: 0.85 };
  else return { r: Math.round(220 + t*(-20)), g: Math.round(80 + t*50), b: Math.round(100 - t*30), a: 0.85 };
}

function getSizeValue(coin) {
  if (sizeKey === 'volume') return coin.total_volume || 1;
  return coin.market_cap || 1;
}

function buildBubbles() {
  if (!coins.length) return;
  const visible = coins.filter(c => {
    if (!searchQ) return true;
    return c.symbol.toLowerCase().includes(searchQ) || c.name.toLowerCase().includes(searchQ);
  });

  const sizeVals = visible.map(c => getSizeValue(c));
  const maxSize = Math.max(...sizeVals);
  const minSize = Math.min(...sizeVals);

  const minR = 18, maxR = Math.min(W, H) * 0.13;

  const existing = {};
  bubbles.forEach(b => { existing[b.id] = { x: b.x, y: b.y, vx: b.vx, vy: b.vy }; });

  bubbles = visible.map(coin => {
    const raw = getSizeValue(coin);
    const t = maxSize === minSize ? 0.5 : (Math.log(raw) - Math.log(minSize)) / (Math.log(maxSize) - Math.log(minSize));
    const r = minR + t * (maxR - minR);
    const pct = coin['price_change_percentage_' + timeKey + '_in_currency'] ?? coin.price_change_percentage_24h;
    const col = changeColor(pct);
    const prev = existing[coin.id];
    return {
      id: coin.id, name: coin.name, symbol: coin.symbol.toUpperCase(),
      price: coin.current_price, pct, mcap: coin.market_cap, volume: coin.total_volume,
      logo: coin.image, rank: coin.market_cap_rank,
      r, col,
      x: prev ? prev.x : W/2 + (Math.random()-0.5)*W*0.6,
      y: prev ? prev.y : H/2 + (Math.random()-0.5)*H*0.6,
      vx: prev ? prev.vx*0.5 : (Math.random()-0.5)*0.5,
      vy: prev ? prev.vy*0.5 : (Math.random()-0.5)*0.5,
      pulse: Math.random()*Math.PI*2,
      logoImg: null, logoLoaded: false
    };
  });

  // pre-load logos
  bubbles.forEach(b => {
    if (b.logo) {
      const img = new Image();
      img.onload = () => { b.logoImg = img; b.logoLoaded = true; };
      img.src = b.logo;
    }
  });
}

function simulate(dt) {
  const cx = W/2 + viewOffset.x, cy = H/2 + viewOffset.y;
  const N = bubbles.length;
  for (let i = 0; i < N; i++) {
    const a = bubbles[i];
    // attract to center
    const dx = cx - a.x, dy = cy - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) + 0.001;
    const force = 0.0008;
    a.vx += dx/dist * force * dist * 0.01;
    a.vy += dy/dist * force * dist * 0.01;
    // repel from others
    for (let j = i+1; j < N; j++) {
      const b = bubbles[j];
      const ex = a.x - b.x, ey = a.y - b.y;
      const d = Math.sqrt(ex*ex + ey*ey) + 0.001;
      const minD = a.r + b.r + 4;
      if (d < minD) {
        const push = (minD - d) / minD * 0.3;
        const nx = ex/d, ny = ey/d;
        a.vx += nx*push; a.vy += ny*push;
        b.vx -= nx*push; b.vy -= ny*push;
      }
    }
    // slight random drift
    a.vx += (Math.random()-0.5)*0.02;
    a.vy += (Math.random()-0.5)*0.02;
    // damping
    a.vx *= 0.92; a.vy *= 0.92;
    // clamp velocity
    const speed = Math.sqrt(a.vx*a.vx+a.vy*a.vy);
    if (speed > 2) { a.vx = a.vx/speed*2; a.vy = a.vy/speed*2; }
    a.x += a.vx; a.y += a.vy;
    a.pulse += 0.025;
  }
}

let logoCache = {};
function drawBubble(b, hovered, t) {
  const { x, y, r, col, symbol, pct, logoLoaded, logoImg } = b;
  const alpha = (!searchQ || b.symbol.toLowerCase().includes(searchQ) || b.name.toLowerCase().includes(searchQ)) ? 1 : 0.15;

  ctx.save();
  ctx.globalAlpha = alpha;

  // outer pulse ring
  if (hovered) {
    const pulseR = r + 8 + Math.sin(t*3)*4;
    ctx.beginPath();
    ctx.arc(x, y, pulseR, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.4)`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // glow
  const glowSize = hovered ? r*2.2 : r*1.6;
  const glow = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
  glow.addColorStop(0, `rgba(${col.r},${col.g},${col.b},${hovered?0.35:0.18})`);
  glow.addColorStop(1, `rgba(${col.r},${col.g},${col.b},0)`);
  ctx.beginPath(); ctx.arc(x, y, glowSize, 0, Math.PI*2);
  ctx.fillStyle = glow; ctx.fill();

  // main circle gradient
  const grad = ctx.createRadialGradient(x - r*0.3, y - r*0.35, r*0.1, x, y, r);
  const br = Math.min(255, col.r + 60), bg = Math.min(255, col.g + 60), bb = Math.min(255, col.b + 60);
  grad.addColorStop(0, `rgba(${br},${bg},${bb},0.95)`);
  grad.addColorStop(0.5, `rgba(${col.r},${col.g},${col.b},0.85)`);
  grad.addColorStop(1, `rgba(${Math.round(col.r*0.5)},${Math.round(col.g*0.5)},${Math.round(col.b*0.5)},0.9)`);

  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();

  // border
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.6)`;
  ctx.lineWidth = hovered ? 1.5 : 0.8;
  ctx.stroke();

  // shine highlight
  const shine = ctx.createRadialGradient(x - r*0.3, y - r*0.4, 0, x - r*0.3, y - r*0.4, r*0.65);
  shine.addColorStop(0, 'rgba(255,255,255,0.25)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = shine; ctx.fill();

  // logo or text
  if (r > 22 && logoLoaded && logoImg) {
    const ir = r * 0.42;
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y - r*0.1, ir, 0, Math.PI*2); ctx.clip();
    ctx.drawImage(logoImg, x-ir, y-r*0.1-ir, ir*2, ir*2);
    ctx.restore();
  }

  // symbol text
  if (r > 16) {
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = `bold ${Math.max(9, Math.min(r*0.28, 14))}px 'Orbitron', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const textY = (r > 30 && logoLoaded) ? y + r*0.38 : y + (r > 25 ? r*0.2 : 0);
    ctx.fillText(symbol.length > 5 ? symbol.slice(0,5) : symbol, x, textY);
  }

  // pct text
  if (r > 26) {
    const pctText = pct != null ? (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%' : '—';
    ctx.font = `${Math.max(8, Math.min(r*0.22, 11))}px 'Space Mono', monospace`;
    ctx.fillStyle = pct >= 0 ? 'rgba(52,211,153,0.9)' : 'rgba(248,113,113,0.9)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(pctText, x, y + r*0.58);
  }

  ctx.restore();
}

function drawStars(t) {
  stars.forEach(s => {
    const op = s.opacity + Math.sin(t * s.twinkleSpeed * 60 + s.twinklePhase) * 0.15;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, op)})`;
    ctx.fill();
  });
}

function drawNebulae() {
  nebulae.forEach(n => {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.rx);
    g.addColorStop(0, `hsla(${n.hue},70%,50%,${n.opacity})`);
    g.addColorStop(1, 'transparent');
    ctx.save();
    ctx.scale(1, n.ry/n.rx);
    ctx.beginPath(); ctx.arc(n.x, n.y * (n.rx/n.ry), n.rx, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  });
}

let lastT = 0;
function draw(ts) {
  const t = ts / 1000;
  const dt = t - lastT; lastT = t;
  ctx.clearRect(0, 0, W, H);

  // bg
  ctx.fillStyle = '#020510'; ctx.fillRect(0, 0, W, H);
  drawNebulae();
  drawStars(t);
  simulate(dt);

  // check hover
  hoveredBubble = null;
  for (let i = bubbles.length-1; i >= 0; i--) {
    const b = bubbles[i];
    const dx = mouseX - b.x, dy = mouseY - b.y;
    if (Math.sqrt(dx*dx+dy*dy) < b.r) { hoveredBubble = b; break; }
  }

  // draw bubbles (hovered last)
  bubbles.forEach(b => { if (b !== hoveredBubble) drawBubble(b, false, t); });
  if (hoveredBubble) drawBubble(hoveredBubble, true, t);

  // update tooltip
  updateTooltip();
  animId = requestAnimationFrame(draw);
}

function updateTooltip() {
  const tt = document.getElementById('tooltip');
  if (!hoveredBubble) { tt.style.opacity = '0'; canvas.style.cursor = 'crosshair'; return; }
  canvas.style.cursor = 'pointer';
  tt.style.opacity = '1';
  const b = hoveredBubble;
  const pct = b.pct;
  const pctStr = pct != null ? (pct>=0?'+':'')+pct.toFixed(2)+'%' : '—';
  const pctCls = pct >= 0 ? 'up' : 'down';
  document.getElementById('ttInner').innerHTML = `
    <div class="tt-header">
      <img class="tt-logo" src="${b.logo||''}" onerror="this.style.display='none'" alt="">
      <div><div class="tt-name">${b.name}</div><div class="tt-symbol">${b.symbol} · #${b.rank||'?'}</div></div>
    </div>
    <div class="tt-row"><span class="tt-lbl">PRICE</span><span class="tt-val">${fmtPrice(b.price)}</span></div>
    <div class="tt-row"><span class="tt-lbl">CHANGE (${timeKey.toUpperCase()})</span><span class="tt-val ${pctCls}">${pctStr}</span></div>
    <div class="tt-row"><span class="tt-lbl">MKT CAP</span><span class="tt-val">${fmtMoney(b.mcap)}</span></div>
    <div class="tt-row"><span class="tt-lbl">VOLUME 24H</span><span class="tt-val">${fmtMoney(b.volume)}</span></div>
  `;
  let tx = mouseX + 16, ty = mouseY - 20;
  if (tx + 200 > W) tx = mouseX - 216;
  if (ty + 200 > H) ty = H - 210;
  tt.style.left = tx + 'px'; tt.style.top = ty + 'px';
}

async function loadData() {
  try {
    const url = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=1h,24h,7d`;
    const res = await fetch(url);
    coins = await res.json();
    buildBubbles();
    updateStats();
    document.getElementById('loadScreen').style.opacity = '0';
    setTimeout(() => document.getElementById('loadScreen').style.display = 'none', 700);
  } catch(e) {
    // fallback mock data
    coins = generateMockData();
    buildBubbles();
    updateStats();
    document.getElementById('loadScreen').style.opacity = '0';
    setTimeout(() => document.getElementById('loadScreen').style.display = 'none', 700);
  }
}

function generateMockData() {
  const mocks = [

function updateStats() {
  const totalMcap = coins.reduce((s,c) => s + (c.market_cap||0), 0);
  const totalVol = coins.reduce((s,c) => s + (c.total_volume||0), 0);
  const gainers = coins.filter(c => (c.price_change_percentage_24h||0) > 0).length;
  const losers = coins.filter(c => (c.price_change_percentage_24h||0) < 0).length;
  document.getElementById('s-count').textContent = coins.length;
  document.getElementById('s-mcap').textContent = fmtMoney(totalMcap);
  document.getElementById('s-vol').textContent = fmtMoney(totalVol);
  document.getElementById('s-up').textContent = gainers;
  document.getElementById('s-down').textContent = losers;
}

function setTime(key, btn) {
  timeKey = key;
  document.querySelectorAll('.ctrl-group')[0].querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildBubbles();
}
function setSize(key, btn) {
  sizeKey = key;
  document.querySelectorAll('.ctrl-group')[1].querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildBubbles();
}
function onSearch(q) {
  searchQ = q.toLowerCase().trim();
  buildBubbles();
}

// Mouse events
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
  if (isDragging) {
    viewOffset.x = viewOffsetStart.x + (e.clientX - dragStart.x);
    viewOffset.y = viewOffsetStart.y + (e.clientY - dragStart.y);
  }
});
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStart = {x: e.clientX, y: e.clientY};
  viewOffsetStart = {...viewOffset};
});
canvas.addEventListener('mouseup', e => { isDragging = false; });
canvas.addEventListener('click', e => {
  if (hoveredBubble) {
    window.open(`https://www.coingecko.com/en/coins/${hoveredBubble.id}`, '_blank');
  }
});
canvas.addEventListener('mouseleave', () => { isDragging = false; });

// Touch
canvas.addEventListener('touchstart', e => { const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY; }, {passive:false});

window.addEventListener('resize', () => { resize(); generateStars(); });

// Init
resize();
requestAnimationFrame(draw);
loadData();
</script>
