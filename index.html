<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crypto Planets</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#040a18;font-family:'Space Mono',monospace}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;cursor:crosshair}
#header{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 24px;display:flex;align-items:center;gap:20px;background:linear-gradient(to bottom,rgba(4,10,24,.95),transparent);pointer-events:none}
.logo{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;background:linear-gradient(135deg,#a78bfa,#38bdf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;pointer-events:all}
.logo span{font-size:11px;display:block;font-weight:400;letter-spacing:.2em;color:#64748b;-webkit-text-fill-color:#64748b}
#controls{display:flex;align-items:center;gap:10px;margin-left:auto;pointer-events:all}
.ctrl-group{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden;pointer-events:all}
.ctrl-btn{background:none;border:none;color:#64748b;padding:7px 14px;cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;transition:all .2s;pointer-events:all}
.ctrl-btn:hover{color:#e2e8f0;background:rgba(255,255,255,.06)}
.ctrl-btn.active{background:rgba(139,92,246,.25);color:#a78bfa;border:1px solid rgba(139,92,246,.4)}
.search-wrap{position:relative;pointer-events:all}
#searchInput{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 14px 7px 34px;color:#ffffff;font-family:'Space Mono',monospace;font-size:12px;outline:none;width:180px;transition:border-color .2s}
#searchInput:focus{border-color:rgba(139,92,246,.8);background:rgba(255,255,255,.18)}
#searchInput::placeholder{color:#94a3b8}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#475569;font-size:14px;pointer-events:none}
#statsBar{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:10px 24px;display:flex;gap:24px;background:linear-gradient(to top,rgba(4,10,24,.95),transparent);pointer-events:none}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-label{font-size:9px;letter-spacing:.12em;color:#334155;text-transform:uppercase}
.stat-value{font-size:13px;font-weight:700;color:#e2e8f0}
.stat-value.up{color:#34d399}
.stat-value.down{color:#f87171}
#tooltip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s}
.tt-inner{background:rgba(7,12,28,.92);border:1px solid rgba(139,92,246,.3);border-radius:12px;padding:14px 16px;backdrop-filter:blur(12px);min-width:180px}
.tt-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tt-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#1e293b}
.tt-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:#e2e8f0}
.tt-symbol{font-size:10px;color:#64748b;letter-spacing:.1em}
.tt-row{display:flex;justify-content:space-between;gap:20px;margin-top:5px}
.tt-lbl{font-size:10px;color:#475569;letter-spacing:.08em}
.tt-val{font-size:12px;font-weight:700;color:#e2e8f0;text-align:right}
.tt-val.up{color:#34d399}
.tt-val.down{color:#f87171}
#loadScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#040a18;gap:16px;transition:opacity .6s}
.load-logo{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#a78bfa,#38bdf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.load-bar{width:200px;height:2px;background:#0f172a;border-radius:2px;overflow:hidden}
.load-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#38bdf8);border-radius:2px;animation:load 2s ease-in-out infinite}
@keyframes load{0%{width:0;margin-left:0}70%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}
.load-text{font-size:11px;letter-spacing:.2em;color:#334155}
#legend{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.leg-item{display:flex;align-items:center;gap:8px}
.leg-dot{border-radius:50%;background:rgba(139,92,246,.3);border:1px solid rgba(139,92,246,.4)}
.leg-lbl{font-size:9px;letter-spacing:.1em;color:#334155}
#colorLegend{position:fixed;left:20px;bottom:60px;z-index:10;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.color-bar{width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,#f87171,#1e293b,#34d399)}
.color-labels{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.08em;color:#475569}
.mb{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#64748b;font-family:'Space Mono',monospace;font-size:10px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .2s}
.mb:hover{color:#e2e8f0;background:rgba(255,255,255,.1)}
.mb.active{background:rgba(139,92,246,.3);color:#a78bfa;border-color:rgba(139,92,246,.5)}

/* Side Panel */
#sidePanel{position:fixed;top:0;right:-420px;width:400px;height:100vh;z-index:150;background:rgba(10,18,40,.98);border-left:1px solid rgba(139,92,246,.3);transition:right .3s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
#sidePanel.open{right:0}
#panelHeader{padding:20px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#panelTitle{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:700;color:#e2e8f0}
#panelClose{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#94a3b8;font-size:16px;cursor:pointer;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
#panelBody{flex:1;overflow-y:auto;padding:16px}

/* Gainers/Losers */
.gl-section{margin-bottom:20px}
.gl-title{font-size:9px;letter-spacing:.15em;color:#475569;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.gl-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);margin-bottom:6px;cursor:pointer;transition:background .2s}
.gl-item:hover{background:rgba(139,92,246,.1)}
.gl-logo{width:32px;height:32px;border-radius:50%;background:#1e293b}
.gl-name{font-size:12px;font-weight:700;color:#e2e8f0}
.gl-sym{font-size:10px;color:#64748b}
.gl-pct{margin-left:auto;font-size:13px;font-weight:700}
.gl-price{font-size:11px;color:#64748b;margin-top:2px}

/* Portfolio */
.pf-total{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(56,189,248,.1));border:1px solid rgba(139,92,246,.3);border-radius:14px;padding:20px;margin-bottom:16px;text-align:center}
.pf-total-label{font-size:9px;letter-spacing:.15em;color:#64748b;margin-bottom:8px}
.pf-total-val{font-size:32px;font-weight:800;color:#ffffff;font-family:'Inter',sans-serif}
.pf-total-pnl{font-size:13px;margin-top:6px;font-weight:600}
.pf-add{display:flex;gap:8px;margin-bottom:16px}
.pf-input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 12px;color:#e2e8f0;font-family:'Space Mono',monospace;font-size:11px;outline:none}
.pf-input:focus{border-color:rgba(139,92,246,.6)}
.pf-input::placeholder{color:#334155}
.pf-btn{background:rgba(139,92,246,.3);border:1px solid rgba(139,92,246,.5);color:#a78bfa;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;white-space:nowrap}
.pf-btn:hover{background:rgba(139,92,246,.5)}
.pf-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);margin-bottom:6px}
.pf-item-info{flex:1}
.pf-item-name{font-size:12px;font-weight:700;color:#e2e8f0}
.pf-item-detail{font-size:10px;color:#64748b;margin-top:2px}
.pf-item-val{text-align:right}
.pf-item-usd{font-size:13px;font-weight:700;color:#e2e8f0}
.pf-item-del{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:#f87171;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}

/* Alerts */
.al-add{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;margin-bottom:16px}
.al-add-title{font-size:10px;letter-spacing:.12em;color:#64748b;margin-bottom:12px}
.al-row{display:flex;gap:8px;margin-bottom:8px}
.al-select{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px;color:#e2e8f0;font-family:'Space Mono',monospace;font-size:11px;outline:none}
.al-select option{background:#0a1228}
.al-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);margin-bottom:6px}
.al-item-info{flex:1}
.al-item-coin{font-size:12px;font-weight:700;color:#e2e8f0}
.al-item-cond{font-size:10px;color:#64748b;margin-top:2px}
.al-item-del{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:#f87171;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.al-triggered{border-color:rgba(251,191,36,.4)!important;background:rgba(251,191,36,.05)!important}
.al-dot{width:8px;height:8px;border-radius:50%;background:#475569;flex-shrink:0}
.al-dot.active{background:#34d399;box-shadow:0 0 6px #34d399}
.al-dot.triggered{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
/* Category bar */
#categoryBar{position:fixed;top:52px;left:0;right:0;z-index:9;padding:6px 16px;display:flex;gap:6px;overflow-x:auto;background:linear-gradient(to bottom,rgba(4,10,24,.85),transparent);scrollbar-width:none;-webkit-overflow-scrolling:touch}
#categoryBar::-webkit-scrollbar{display:none}
.cat-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#64748b;padding:5px 12px;border-radius:20px;cursor:pointer;font-family:'Space Mono',monospace;font-size:10px;white-space:nowrap;transition:all .2s;pointer-events:all;flex-shrink:0}
.cat-btn:hover{color:#e2e8f0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.cat-btn.active{background:rgba(139,92,246,.3);color:#a78bfa;border-color:rgba(139,92,246,.5)}

@media(max-width:600px){
  /* Header compacto em 2 linhas */
  #header{padding:6px 10px;gap:4px;flex-wrap:wrap;align-items:center}
  .logo{font-size:13px;flex-shrink:0}
  .logo span{display:none}
  #controls{gap:4px;margin-left:0;width:100%;overflow-x:auto;padding-bottom:2px;flex-wrap:nowrap}
  .ctrl-group{flex-shrink:0}

  /* Esconde botões secundários no mobile */
  #ctrlLang{display:none}
  #ctrlRefresh{display:none}

  /* Inputs menores */
  #searchInput{width:110px;font-size:16px;padding:5px 8px 5px 24px;color:#ffffff}
  .search-icon{font-size:12px;left:7px}
  .ctrl-btn{padding:5px 8px;font-size:9px;letter-spacing:0}

  /* Stats bar */
  #statsBar{padding:5px 10px;gap:8px;overflow-x:auto;flex-wrap:nowrap}
  .stat-value{font-size:10px}
  .stat-label{font-size:7px}

  /* Esconde legend */
  #legend{display:none}
  #colorLegend{display:none}

  /* Side panel full screen */
  #sidePanel{width:100vw;right:-100vw}
  #sidePanel.open{right:0}
  /* Search fix - expand when focused */
  .search-wrap{flex-shrink:0}
  #searchInput:focus{position:fixed;top:8px;left:8px;right:8px;width:calc(100vw - 16px)!important;z-index:300;font-size:16px;padding:10px 14px;border-radius:10px;background:rgba(10,18,40,.98)!important;border-color:rgba(139,92,246,.8)!important;box-shadow:0 4px 20px rgba(0,0,0,.5)}

  /* Modal mobile */
  #modalBox{width:96vw!important;max-height:88vh!important;border-radius:14px!important}
  #mPrice{font-size:20px!important}
  #mName{font-size:12px!important}
  #mMcap,#mVol,#mRank{font-size:12px!important}
  #mTimeBar{gap:3px!important;padding:6px!important}
  .mb{padding:4px 6px!important;font-size:9px!important}

  /* Modal stats grid no mobile */
  #modalBox > div:nth-child(2){flex-wrap:wrap}
  #modalBox > div:nth-child(2) > div{flex:1 1 45%;min-width:0}
}
</style>
</head>
<body>

<div id="loadScreen">
  <div class="load-logo">CRYPTO PLANETS</div>
  <div class="load-bar"><div class="load-fill"></div></div>
  <div class="load-text">MAPPING THE UNIVERSE</div>
</div>

<canvas id="canvas"></canvas>

<div id="header">
  <div class="logo" onclick="resetView()" style="cursor:pointer">CRYPTO PLANETS<span>EXPLORE THE CRYPTO UNIVERSE</span></div>
  <div id="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn" onclick="setTime('1h',this)">1H</button>
      <button class="ctrl-btn active" onclick="setTime('24h',this)">24H</button>
      <button class="ctrl-btn" onclick="setTime('7d',this)">7D</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn active" onclick="setSize('mcap',this)">MKT CAP</button>
      <button class="ctrl-btn" onclick="setSize('volume',this)">VOLUME</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌖</span>
      <input id="searchInput" placeholder="Search coin..." oninput="onSearch(this.value)">
    </div>
    <div class="ctrl-group" id="ctrlLang">
      <button class="ctrl-btn" onclick="toggleLang()" id="langBtn">🌐 EN</button>
    </div>
    <div class="ctrl-group" id="ctrlRefresh">
      <button class="ctrl-btn" onclick="loadData()" style="pointer-events:all">↻ <span data-i18n="refresh">REFRESH</span></button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn" onclick="openPanel('gainers')">🏆 <span data-i18n="top">TOP</span></button>
      <button class="ctrl-btn" onclick="openPanel('portfolio')">💼 <span data-i18n="portfolio">PORTFÓLIO</span></button>
      <button class="ctrl-btn" onclick="openPanel('alerts')">🔔 <span data-i18n="alerts">ALERTAS</span></button>
    </div>
  </div>
</div>

<div id="categoryBar">
  <button class="cat-btn active" onclick="setCategory('all',this)" data-i18n-cat="all">🌐 ALL</button>
  <button class="cat-btn" onclick="setCategory('layer1',this)" data-i18n-cat="layer1">⛓️ LAYER 1</button>
  <button class="cat-btn" onclick="setCategory('layer2',this)" data-i18n-cat="layer2">🔗 LAYER 2</button>
  <button class="cat-btn" onclick="setCategory('defi',this)" data-i18n-cat="defi">🏦 DEFI</button>
  <button class="cat-btn" onclick="setCategory('meme',this)" data-i18n-cat="meme">🐸 MEME</button>
  <button class="cat-btn" onclick="setCategory('stablecoin',this)" data-i18n-cat="stablecoin">💵 STABLE</button>
  <button class="cat-btn" onclick="setCategory('ai',this)" data-i18n-cat="ai">🤖 AI</button>
</div>
  <div class="stat"><div class="stat-label" data-i18n="coinsTracked">COINS TRACKED</div><div class="stat-value" id="s-count">—</div></div>
  <div class="stat"><div class="stat-label" data-i18n="totalMcap">TOTAL MKT CAP</div><div class="stat-value" id="s-mcap">—</div></div>
  <div class="stat"><div class="stat-label" data-i18n="volume24h">24H VOLUME</div><div class="stat-value" id="s-vol">—</div></div>
  <div class="stat"><div class="stat-label" data-i18n="gainers">GAINERS</div><div class="stat-value up" id="s-up">—</div></div>
  <div class="stat"><div class="stat-label" data-i18n="losers">LOSERS</div><div class="stat-value down" id="s-down">—</div></div>
</div>

<div id="legend">
  <div class="leg-item"><div class="leg-dot" style="width:40px;height:40px"></div><div class="leg-lbl" data-i18n="largeCap">LARGE CAP</div></div>
  <div class="leg-item"><div class="leg-dot" style="width:26px;height:26px"></div><div class="leg-lbl" data-i18n="midCap">MID CAP</div></div>
  <div class="leg-item"><div class="leg-dot" style="width:14px;height:14px"></div><div class="leg-lbl" data-i18n="smallCap">SMALL CAP</div></div>
</div>

<div id="colorLegend">
  <div class="color-bar"></div>
  <div class="color-labels"><span data-i18n="falling">FALLING</span><span data-i18n="rising">RISING</span></div>
</div>

<div id="tooltip"><div class="tt-inner" id="ttInner"></div></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let coins = [], bubbles = [], stars = [], nebulae = [];
let timeKey = '24h', sizeKey = 'mcap', searchQ = '';
let animId = null, hoveredBubble = null;
let mouseX = 0, mouseY = 0;
let isDragging = false, dragStart = {x:0,y:0}, viewOffset = {x:0,y:0}, viewOffsetStart = {x:0,y:0};
let shootingStars = [], milkyWayPoints = [];

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  if (stars.length === 0) generateStars();
}

function generateStars() {
  stars = [];
  for (let i = 0; i < 400; i++) {
    const hues = [0,30,60,200,220,260,0];
    const hue = hues[Math.floor(Math.random()*hues.length)];
    const sat = Math.random()<0.3?Math.floor(Math.random()*60+20):0;
    stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.0+0.1,opacity:Math.random()*0.5+0.3,twinkleSpeed:Math.random()*0.03+0.004,twinklePhase:Math.random()*Math.PI*2,hue,sat,big:false});
  }
  for (let i = 0; i < 40; i++) {
    stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+1.0,opacity:Math.random()*0.5+0.5,twinkleSpeed:Math.random()*0.04+0.01,twinklePhase:Math.random()*Math.PI*2,hue:[0,200,220,260,40][Math.floor(Math.random()*5)],sat:Math.random()<0.5?80:0,big:true});
  }
  nebulae = [];
  const neb=[{hue:260,sat:80},{hue:200,sat:70},{hue:160,sat:60},{hue:280,sat:90},{hue:220,sat:75},{hue:320,sat:70},{hue:180,sat:65}];
  for(let i=0;i<neb.length;i++){
    nebulae.push({x:Math.random()*W,y:Math.random()*H,rx:Math.random()*400+200,ry:Math.random()*280+120,hue:neb[i].hue,sat:neb[i].sat,opacity:Math.random()*0.025+0.008,angle:Math.random()*Math.PI});
  }
  milkyWayPoints=[];
  const ba=0.3;
  for(let i=0;i<350;i++){
    const t=Math.random();
    const along=t*(W*1.6)-W*0.3;
    const across=(Math.random()-0.5)*(H*0.35)*Math.exp(-Math.abs(t-0.5)*2);
    milkyWayPoints.push({x:along*Math.cos(ba)-across*Math.sin(ba),y:along*Math.sin(ba)+across*Math.cos(ba)+H*0.3,r:Math.random()*0.9+0.2,op:Math.random()*0.4+0.1});
  }
  shootingStars=[];
}

function fmtMoney(n){if(!n)return'—';if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(4);}
function fmtPrice(n){if(!n)return'—';if(n>=1000)return'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=1)return'$'+n.toFixed(2);if(n>=0.01)return'$'+n.toFixed(4);if(n>=0.0001)return'$'+n.toFixed(6);return'$'+n.toFixed(8);}

function changeColor(pct){
  if(pct===null||pct===undefined)return{r:60,g:80,b:120,a:0.9};
  const t=Math.max(-1,Math.min(1,pct/15));
  if(t>=0)return{r:Math.round(20+t*20),g:Math.round(100+t*80),b:Math.round(40+t*20),a:0.95,rim:`rgba(${Math.round(50+t*150)},${Math.round(210+t*45)},${Math.round(80+t*20)},0.95)`};
  else return{r:Math.round(120-t*(-80)),g:Math.round(20-t*(-15)),b:Math.round(20-t*(-10)),a:0.95,rim:`rgba(${Math.round(210-t*(-45))},${Math.round(40-t*(-20))},${Math.round(40-t*(-15))},0.95)`};
}
function getSizeValue(coin){return sizeKey==='volume'?coin.total_volume||1:coin.market_cap||1;}

function buildBubbles(){
  if(!coins.length)return;
  const visible=filterByCategory(coins).filter(c=>{if(!searchQ)return true;return (c.symbol||'').toLowerCase().includes(searchQ)||(c.name||'').toLowerCase().includes(searchQ);});
  const sizeVals=visible.map(c=>getSizeValue(c));
  const maxSize=Math.max(...sizeVals),minSize=Math.min(...sizeVals);
  const isMobile = W < 600;
  const minR=isMobile?14:22, maxR=Math.min(W,H)*(isMobile?0.08:0.11);
  const existing={};
  bubbles.forEach(b=>{existing[b.id]={x:b.x,y:b.y,vx:b.vx,vy:b.vy};});
  bubbles=visible.map(coin=>{
    const raw=getSizeValue(coin);
    const t=maxSize===minSize?0.5:(Math.log(raw)-Math.log(minSize))/(Math.log(maxSize)-Math.log(minSize));
    const r=minR+t*(maxR-minR);
    const pct=coin['price_change_percentage_'+timeKey+'_in_currency']??coin.price_change_percentage_24h;
    const col=changeColor(pct);
    const prev=existing[coin.id];
    return{id:coin.id,name:coin.name,symbol:coin.symbol.toUpperCase(),price:coin.current_price,pct,mcap:coin.market_cap,volume:coin.total_volume,logo:coin.image,rank:coin.market_cap_rank,r,col,x:prev?prev.x:W/2+(Math.random()-0.5)*W*(isMobile?0.4:0.6),y:prev?prev.y:H/2+(Math.random()-0.5)*H*(isMobile?0.4:0.6),vx:prev?prev.vx*0.5:(Math.random()-0.5)*0.5,vy:prev?prev.vy*0.5:(Math.random()-0.5)*0.5,pulse:Math.random()*Math.PI*2,logoImg:null,logoLoaded:false};
  });
  bubbles.forEach(b=>{if(b.logo){const img=new Image();img.onload=()=>{b.logoImg=img;b.logoLoaded=true;};img.src=b.logo;}});
}

function simulate(dt){
  const cx=W/2+viewOffset.x,cy=H/2+viewOffset.y;
  const N=bubbles.length;
  for(let i=0;i<N;i++){
    const a=bubbles[i];
    const dx=cx-a.x,dy=cy-a.y;
    const dist=Math.sqrt(dx*dx+dy*dy)+0.001;
    a.vx+=dx/dist*0.0004*dist*0.008;
    a.vy+=dy/dist*0.0004*dist*0.008;
    for(let j=i+1;j<N;j++){
      const b=bubbles[j];
      const ex=a.x-b.x,ey=a.y-b.y;
      const d=Math.sqrt(ex*ex+ey*ey)+0.001;
      const minD=a.r+b.r+14;
      if(d<minD){const push=(minD-d)/minD*0.45;const nx=ex/d,ny=ey/d;a.vx+=nx*push;a.vy+=ny*push;b.vx-=nx*push;b.vy-=ny*push;}
    }
    a.vx+=(Math.random()-0.5)*0.02;a.vy+=(Math.random()-0.5)*0.02;
    a.vx*=0.92;a.vy*=0.92;
    const speed=Math.sqrt(a.vx*a.vx+a.vy*a.vy);
    if(speed>2){a.vx=a.vx/speed*2;a.vy=a.vy/speed*2;}
    a.x+=a.vx;a.y+=a.vy;a.pulse+=0.025;
    // Keep inside screen with soft walls
    const margin=a.r+8;
    const topMargin=a.r+90;
    const bottomMargin=a.r+55;
    if(a.x<margin){a.vx+=0.5;a.x=Math.max(margin,a.x);}
    if(a.x>W-margin){a.vx-=0.5;a.x=Math.min(W-margin,a.x);}
    if(a.y<topMargin){a.vy+=0.5;a.y=Math.max(topMargin,a.y);}
    if(a.y>H-bottomMargin){a.vy-=0.5;a.y=Math.min(H-bottomMargin,a.y);}
  }
}

function drawBubble(b,hovered,t){
  const{x,y,r,col,symbol,pct,logoLoaded,logoImg}=b;
  const alpha=(!searchQ||b.symbol.toLowerCase().includes(searchQ)||b.name.toLowerCase().includes(searchQ))?1:0.1;
  const isUp=pct>=0;
  const absPct=Math.abs(pct||0);
  const rim=col.rim||'rgba(100,100,100,0.6)';

  ctx.save();ctx.globalAlpha=alpha;

  // Outer glow for movers
  if(absPct>3){
    const intensity=Math.min(1,absPct/20);
    const glowSize=r+4+Math.sin(t*2)*2;
    const grd=ctx.createRadialGradient(x,y,r*0.9,x,y,glowSize+8);
    grd.addColorStop(0,isUp?`rgba(60,220,80,${0.15+intensity*0.2})`:`rgba(220,50,50,${0.15+intensity*0.2})`);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(x,y,glowSize+8,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();
  }

  // Hover
  if(hovered){
    ctx.beginPath();ctx.arc(x,y,r+8,0,Math.PI*2);
    ctx.strokeStyle=isUp?'rgba(80,255,100,0.7)':'rgba(255,80,80,0.7)';
    ctx.lineWidth=3;ctx.stroke();
  }

  // Dark fill
  const grad=ctx.createRadialGradient(x-r*0.25,y-r*0.3,0,x,y,r);
  grad.addColorStop(0,`rgba(${Math.min(255,col.r+60)},${Math.min(255,col.g+60)},${Math.min(255,col.b+40)},1)`);
  grad.addColorStop(0.5,`rgba(${Math.min(255,col.r+25)},${Math.min(255,col.g+25)},${Math.min(255,col.b+15)},1)`);
  grad.addColorStop(1,`rgba(${col.r},${col.g},${col.b},1)`);
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();

  // Vivid rim border
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.strokeStyle=rim;
  ctx.lineWidth=Math.max(2,r*0.06);ctx.stroke();

  // Inner subtle highlight
  const hl=ctx.createRadialGradient(x-r*0.3,y-r*0.35,0,x,y,r*0.8);
  hl.addColorStop(0,'rgba(255,255,255,0.10)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();

  // Logo — show on medium+ bubbles
  if(r>25&&logoLoaded&&logoImg){
    const ls=r*(r>60?0.40:r>40?0.44:0.50);
    const ly=r>40?y-r*0.25:y-r*0.20;
    ctx.save();
    ctx.beginPath();ctx.arc(x,ly,ls/2,0,Math.PI*2);ctx.clip();
    ctx.drawImage(logoImg,x-ls/2,ly-ls/2,ls,ls);
    ctx.restore();
  }

  // Symbol — fills the bubble proportionally
  if(r>12){
    const hasLogo=r>25&&logoLoaded;
    const sy=hasLogo?y+r*(r>60?0.14:0.18):y-(r>22?r*0.17:0);
    const sym=symbol.length>6?symbol.slice(0,6):symbol;
    let fs=r*(hasLogo?0.38:0.55);
    ctx.font=`bold ${fs}px Arial,sans-serif`;
    const tw=ctx.measureText(sym).width;
    if(tw>r*1.75) fs=fs*(r*1.75/tw);
    ctx.font=`bold ${Math.max(11,fs)}px Arial,sans-serif`;
    ctx.fillStyle='#ffffff';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(sym,x,sy);
  }

  // Pct
  if(r>18){
    const pctText=pct!=null?(pct>=0?'+':'')+pct.toFixed(1)+'%':'—';
    const hasLogo=r>25&&logoLoaded;
    const ps=Math.max(9,r*(hasLogo?0.23:0.29));
    ctx.font=`bold ${ps}px Arial,sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const py=hasLogo?y+r*(r>60?0.52:0.56):y+r*0.38;
    ctx.fillText(pctText,x,py);
  }

  ctx.restore();
}

function drawStars(t){
  milkyWayPoints.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,220,255,${s.op})`;ctx.fill();});
  stars.forEach(s=>{
    const op=s.opacity+Math.sin(t*s.twinkleSpeed*60+s.twinklePhase)*0.2;
    const finalOp=Math.max(0,op);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=s.sat>0?`hsla(${s.hue},${s.sat}%,90%,${finalOp})`:`rgba(255,255,255,${finalOp})`;ctx.fill();
    if(s.big&&s.r>1.8){const len=s.r*4;ctx.save();ctx.globalAlpha=finalOp*0.4;ctx.strokeStyle=s.sat>0?`hsla(${s.hue},${s.sat}%,90%,1)`:`rgba(255,255,255,1)`;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(s.x-len,s.y);ctx.lineTo(s.x+len,s.y);ctx.moveTo(s.x,s.y-len);ctx.lineTo(s.x,s.y+len);ctx.stroke();ctx.restore();}
  });
  if(Math.random()<0.004){shootingStars.push({x:Math.random()*W*0.7,y:Math.random()*H*0.5,vx:6+Math.random()*6,vy:2+Math.random()*4,len:80+Math.random()*120,life:1.0});}
  shootingStars=shootingStars.filter(s=>s.life>0);
  shootingStars.forEach(s=>{
    ctx.save();ctx.globalAlpha=s.life*0.8;
    const g=ctx.createLinearGradient(s.x,s.y,s.x-s.len*(s.vx/8),s.y-s.len*(s.vy/8));
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.len*(s.vx/8),s.y-s.len*(s.vy/8));ctx.stroke();ctx.restore();
    s.x+=s.vx;s.y+=s.vy;s.life-=0.025;
  });
}

function drawNebulae(){
  nebulae.forEach(n=>{
    ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.angle||0);
    const g2=ctx.createRadialGradient(0,0,0,0,0,n.rx*1.4);
    g2.addColorStop(0,`hsla(${n.hue},${n.sat||70}%,55%,${n.opacity*0.5})`);
    g2.addColorStop(0.5,`hsla(${n.hue},${n.sat||70}%,40%,${n.opacity*0.3})`);
    g2.addColorStop(1,'transparent');
    ctx.scale(1,n.ry/n.rx);ctx.beginPath();ctx.arc(0,0,n.rx*1.4,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
    ctx.scale(1,1);
    const g=ctx.createRadialGradient(0,0,0,0,0,n.rx*0.5);
    g.addColorStop(0,`hsla(${n.hue},${n.sat||70}%,75%,${n.opacity*1.5})`);g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(0,0,n.rx*0.5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.restore();
  });
}

let lastT=0;
function draw(ts){
  const t=ts/1000;const dt=t-lastT;lastT=t;
  ctx.clearRect(0,0,W,H);
  const bgGrad=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,Math.max(W,H)*0.85);
  bgGrad.addColorStop(0,'#1a1f35');bgGrad.addColorStop(0.5,'#12182a');bgGrad.addColorStop(1,'#0a0e1e');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  drawNebulae();drawStars(t);simulate(dt);
  hoveredBubble=null;
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];const dx=mouseX-b.x,dy=mouseY-b.y;if(Math.sqrt(dx*dx+dy*dy)<b.r){hoveredBubble=b;break;}}
  bubbles.forEach(b=>{if(b!==hoveredBubble)drawBubble(b,false,t);});
  if(hoveredBubble)drawBubble(hoveredBubble,true,t);
  updateTooltip();
  requestAnimationFrame(draw);
}

function updateTooltip(){
  const tt=document.getElementById('tooltip');
  if(!hoveredBubble){tt.style.opacity='0';canvas.style.cursor='crosshair';return;}
  canvas.style.cursor='pointer';tt.style.opacity='1';
  const b=hoveredBubble;const pct=b.pct;
  const pctStr=pct!=null?(pct>=0?'+':'')+pct.toFixed(2)+'%':'—';
  const pctCls=pct>=0?'up':'down';
  document.getElementById('ttInner').innerHTML=`<div class="tt-header"><img class="tt-logo" src="${b.logo||''}" onerror="this.style.display='none'" alt=""><div><div class="tt-name">${b.name}</div><div class="tt-symbol">${b.symbol} · #${b.rank||'?'}</div></div></div><div class="tt-row"><span class="tt-lbl">PRICE</span><span class="tt-val">${fmtPrice(b.price)}</span></div><div class="tt-row"><span class="tt-lbl">CHANGE (${timeKey.toUpperCase()})</span><span class="tt-val ${pctCls}">${pctStr}</span></div><div class="tt-row"><span class="tt-lbl">MKT CAP</span><span class="tt-val">${fmtMoney(b.mcap)}</span></div><div class="tt-row"><span class="tt-lbl">VOLUME 24H</span><span class="tt-val">${fmtMoney(b.volume)}</span></div>`;
  let tx=mouseX+16,ty=mouseY-20;
  if(tx+200>W)tx=mouseX-216;if(ty+200>H)ty=H-210;
  tt.style.left=tx+'px';tt.style.top=ty+'px';
}

async function loadData(){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),8000);
    const res=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false&price_change_percentage=1h,24h,7d',{signal:controller.signal});
    clearTimeout(timeout);
    coins=await res.json();
  }catch(e){coins=generateMockData();}
  buildBubbles();updateStats();
  checkAlerts();
  if(currentPanel==='gainers')renderGainers();
  else if(currentPanel==='portfolio')renderPortfolio();
  else if(currentPanel==='alerts')renderAlerts();
  document.getElementById('loadScreen').style.opacity='0';
  setTimeout(()=>document.getElementById('loadScreen').style.display='none',700);
  startAutoRefresh();
}

let refreshInterval=null;
function startAutoRefresh(){
  if(refreshInterval)clearInterval(refreshInterval);
  let countdown=30;
  const btn=document.querySelector('[onclick="loadData()"]');
  refreshInterval=setInterval(async()=>{
    countdown--;
    if(btn)btn.querySelector('span').textContent=`ATUALIZAR (${countdown}s)`;
    if(countdown<=0){
      countdown=30;
      if(btn)btn.querySelector('span').textContent='ATUALIZAR';
      try{

        const p2=await r2.json();
        coins=[...p1,...p2];
      }catch(e){}
      buildBubbles();updateStats();checkAlerts();
      if(currentPanel==='gainers')renderGainers();
    }
  },1000);
}

function filterByCategory(coinList) {
  if(currentCategory === 'all') return coinList.slice(0, 100);
  // Special case: use dedicated meme API data
  if(currentCategory === 'meme' && memeCoins.length > 0) {
    // Merge: prefer main list data, supplement with meme API data
    const mainIds = coinList.map(c => c.id);
    const extra = memeCoins.filter(c => !mainIds.includes(c.id));
    const merged = [...coinList.filter(c => catFilters.meme(c.id)), ...extra];
    return merged.slice(0, 40);
  }
  const filter = catFilters[currentCategory];
  if(!filter) return coinList.slice(0, 100);
  let filtered;
  if(currentCategory === 'defi' || currentCategory === 'stablecoin') {
    filtered = coinList.filter(c => filter((c.symbol||'').toUpperCase()));
  } else {
    filtered = coinList.filter(c => filter(c.id));
  }
  return filtered.length >= 1 ? filtered : coinList.slice(0, 100);
}
function resetView(){
  viewOffset={x:0,y:0};
  viewOffsetStart={x:0,y:0};
  bubbles.forEach(b=>{
    b.x=W/2+(Math.random()-0.5)*W*0.3;
    b.y=H/2+(Math.random()-0.5)*H*0.3;
    b.vx=0;b.vy=0;
  });
}
function setTime(key,btn){timeKey=key;document.querySelectorAll('.ctrl-group')[0].querySelectorAll('.ctrl-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');buildBubbles();}
function setSize(key,btn){sizeKey=key;document.querySelectorAll('.ctrl-group')[1].querySelectorAll('.ctrl-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');buildBubbles();}
function onSearch(q){searchQ=q.toLowerCase().trim();buildBubbles();}

canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;if(isDragging){viewOffset.x=viewOffsetStart.x+(e.clientX-dragStart.x);viewOffset.y=viewOffsetStart.y+(e.clientY-dragStart.y);}});
canvas.addEventListener('mousedown',e=>{isDragging=true;dragStart={x:e.clientX,y:e.clientY};viewOffsetStart={...viewOffset};});
canvas.addEventListener('mouseup',()=>{isDragging=false;});
canvas.addEventListener('mouseleave',()=>{isDragging=false;});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();const cx=e.clientX-r.left;const cy=e.clientY-r.top;
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];const dx=cx-b.x,dy=cy-b.y;if(Math.sqrt(dx*dx+dy*dy)<b.r){showModal(b);break;}}
});
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];mouseX=t.clientX;mouseY=t.clientY;dragStart={x:t.clientX,y:t.clientY};viewOffsetStart={...viewOffset};},{passive:true});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouseX=t.clientX;mouseY=t.clientY;viewOffset.x=viewOffsetStart.x+(t.clientX-dragStart.x);viewOffset.y=viewOffsetStart.y+(t.clientY-dragStart.y);},{passive:false});
canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(Math.abs(t.clientX-dragStart.x)<8&&Math.abs(t.clientY-dragStart.y)<8){const r=canvas.getBoundingClientRect();const cx=t.clientX-r.left;const cy=t.clientY-r.top;for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];const dx=cx-b.x,dy=cy-b.y;if(Math.sqrt(dx*dx+dy*dy)<b.r){showModal(b);break;}}}});

// ─── ALERTS ───
function saveAlerts(){localStorage.setItem('cp_alerts',JSON.stringify(alerts));}
function renderAlerts() {
  document.getElementById('panelTitle').textContent = t('myAlerts');
  document.getElementById('panelBody').innerHTML = `
    <div class="al-add">
      <div class="al-add-title">${t('createAlert')}</div>
      <div class="al-row"><select class="al-select" id="alCoin" onchange="updateAlertHint()">${coins.map(c=>`<option value="${c.id}" data-price="${c.current_price}">${c.name} (${c.symbol.toUpperCase()}) — ${fmtPrice(c.current_price)}</option>`).join('')}</select></div>
      <div id="alPriceHint" style="font-size:11px;color:#64748b;padding:4px 2px 6px"></div>

    ${alerts.length===0?`<div style="text-align:center;color:#334155;font-size:11px;padding:30px">${t('emptyAlerts')}</div>`:''}
    ${alerts.map((a,i)=>{

        </div>
        <button class="al-item-del" onclick="removeAlert(${i})">✕</button>
      </div>`;
    }).join('')}`;
}
function updateAlertHint(){
  const id=document.getElementById('alCoin')?.value;
  const dir=document.getElementById('alDir')?.value;
  const hint=document.getElementById('alPriceHint');
  if(!hint||!id)return;
  const coin=coins.find(c=>c.id===id);
  if(!coin)return;
  const curr=fmtPrice(coin.current_price);
  const dirText=dir==='above'?(lang==='pt'?'maior que':'greater than'):(lang==='pt'?'menor que':'less than');
  hint.textContent=(lang==='pt'?`Preço atual: ${curr} — Digite um valor ${dirText} este`:`Current price: ${curr} — Enter a value ${dirText} this`);
}
function addAlert(){
  const id=document.getElementById('alCoin').value;
  const dir=document.getElementById('alDir').value;
  const raw=document.getElementById('alPrice').value.replace(/\./g,'').replace(',','.');
  const target=parseFloat(raw);
  if(!id||!target||target<=0){
    alert(lang==='pt'?'Digite um preço válido!':'Enter a valid price!');
    return;
  }
  const coin=coins.find(c=>c.id===id);
  const curr=coin?.current_price||0;
  // Validate logic
  if(dir==='above'&&target<=curr){
    const msg=lang==='pt'
      ?`Preço alvo ($${target}) deve ser MAIOR que o preço atual ($${fmtPrice(curr).replace('$','')}).\n\nPreço atual do ${coin?.name}: ${fmtPrice(curr)}`
      :`Target price ($${target}) must be ABOVE current price (${fmtPrice(curr)}).\n\nCurrent ${coin?.name} price: ${fmtPrice(curr)}`;
    alert(msg);return;
  }
  if(dir==='below'&&target>=curr){
    const msg=lang==='pt'
      ?`Preço alvo deve ser MENOR que o preço atual (${fmtPrice(curr)}).\n\nPreço atual do ${coin?.name}: ${fmtPrice(curr)}`
      :`Target price must be BELOW current price (${fmtPrice(curr)}).\n\nCurrent ${coin?.name} price: ${fmtPrice(curr)}`;
    alert(msg);return;
  }
  alerts.push({id,dir,target,notified:false});
  saveAlerts();renderAlerts();
  requestNotifPermission();
}
function removeAlert(i){alerts.splice(i,1);saveAlerts();renderAlerts();}
function requestNotifPermission(){if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();}
function checkAlerts(){
  alerts.forEach(a=>{
    const coin=coins.find(c=>c.id===a.id);
    if(!coin||a.notified)return;
    const curr=coin.current_price;

function loadChart(days){
  chartDays=days;

  fetch(`https://api.coingecko.com/api/v3/coins/${currentCoinId}/market_chart?vs_currency=usd&days=${days}`)
    .then(r=>r.json()).then(data=>{document.getElementById('mLoading').style.display='none';drawChart(data.prices,days);})
    .catch(()=>{document.getElementById('mLoading').textContent='Erro ao carregar gráfico.';});
}

function drawChart(prices,days){
  const canvas=document.getElementById('mChart');
  const container=canvas.parentElement;
  const dpr=window.devicePixelRatio||1;
  canvas.width=container.clientWidth*dpr;
  canvas.height=(container.clientHeight-24)*dpr;
  canvas.style.width=container.clientWidth+'px';
  canvas.style.height=(container.clientHeight-24)+'px';
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const vals=prices.map(p=>p[1]);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const margin=(maxV-minV)*0.12||maxV*0.05;
  const lo=minV-margin,hi=maxV+margin,range=hi-lo||1;
  const isUp=vals[vals.length-1]>=vals[0];
  const color=isUp?'#34d399':'#f87171';
  const pad={l:70*dpr,r:80*dpr,t:30*dpr,b:60*dpr};
  const toX=i=>pad.l+(i/(vals.length-1))*(W-pad.l-pad.r);
  const toY=v=>pad.t+(1-(v-lo)/range)*(H-pad.t-pad.b);
  ctx.fillStyle='rgba(255,255,255,0.03)';ctx.beginPath();ctx.roundRect(pad.l,pad.t,W-pad.l-pad.r,H-pad.t-pad.b,8*dpr);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+(i/4)*(H-pad.t-pad.b);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#cbd5e1';ctx.font=`bold ${10*dpr}px Space Mono,monospace`;ctx.textAlign='right';
    ctx.fillText(fmtPrice(hi-(i/4)*range),pad.l-8,y+4*dpr);
  }
  const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
  grad.addColorStop(0,isUp?'rgba(52,211,153,.25)':'rgba(248,113,113,.25)');grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.moveTo(toX(0),toY(vals[0]));vals.forEach((v,i)=>ctx.lineTo(toX(i),toY(v)));
  ctx.lineTo(toX(vals.length-1),H-pad.b);ctx.lineTo(toX(0),H-pad.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(toX(0),toY(vals[0]));vals.forEach((v,i)=>ctx.lineTo(toX(i),toY(v)));
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  const lx=toX(vals.length-1),ly=toY(vals[vals.length-1]);
  ctx.beginPath();ctx.arc(lx,ly,5*dpr,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.arc(lx,ly,9*dpr,0,Math.PI*2);ctx.strokeStyle=color;ctx.globalAlpha=0.3;ctx.lineWidth=2*dpr;ctx.stroke();ctx.globalAlpha=1;
  const lc=Math.min(6,vals.length);ctx.textAlign='center';ctx.font=`bold ${11*dpr}px Space Mono,monospace`;
  for(let i=0;i<lc;i++){
    const idx=Math.floor(i*(vals.length-1)/(lc-1));
    const date=new Date(prices[idx][0]);
    const label=days<=1?date.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):date.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const tw=ctx.measureText(label).width+10*dpr;
    ctx.fillStyle='rgba(15,23,42,0.85)';ctx.beginPath();ctx.roundRect(toX(idx)-tw/2,H-pad.b+8*dpr,tw,20*dpr,4*dpr);ctx.fill();
    ctx.fillStyle='#cbd5e1';ctx.fillText(label,toX(idx),H-pad.b+22*dpr);
  }
}

function t(key){return i18n[lang][key]||key;}

function applyLang(){
  const isEn = lang === 'en';

  // Botão de idioma
  document.getElementById('langBtn').textContent = isEn ? '🌐 PT' : '🌐 EN';

  // Search placeholder
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');

  // Stats bar
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = t(key);
    if(val) el.textContent = val;
  });

  // Botões do header
  const btns = document.querySelectorAll('#controls .ctrl-btn');
  btns.forEach(btn => {
    const span = btn.querySelector('span[data-i18n]');
    if(span) span.textContent = t(span.dataset.i18n);
  });

  // Modal buttons
  const binBtn = document.getElementById('btnBinance');
  if(binBtn) binBtn.textContent = t('openBinance');
  const cgLink = document.getElementById('mCgLink');
  if(cgLink && !cgLink.href.includes('coingecko.com/en/coins/')) cgLink.textContent = t('openCg');

  // Loading chart text
  const mLoad = document.getElementById('mLoading');
  if(mLoad) mLoad.textContent = t('loadingChart');

  // Category buttons
  const catMap = {all:'catAll',layer1:'catL1',layer2:'catL2',defi:'catDefi',meme:'catMeme',stablecoin:'catStable',nft:'catNft',ai:'catAi'};
  document.querySelectorAll('.cat-btn').forEach(btn => {
    const cat = btn.getAttribute('onclick').match(/setCategory\('(\w+)'/)?.[1];
    if(cat && catMap[cat]) btn.textContent = t(catMap[cat]);
  });

  // Re-render panel if open
  if(currentPanel) openPanel(currentPanel);
}

function toggleLang(){
  lang=lang==='pt'?'en':'pt';
  localStorage.setItem('cp_lang',lang);
  applyLang();
}

applyLang();
function closeModal(){document.getElementById('modal').style.display='none';}
